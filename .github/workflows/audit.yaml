---
name: Security Audit

on:
    schedule:
        - cron: 0 0 1,15 * *
    push:
        paths:
            - '**/Cargo.toml'
            - '**/Cargo.lock'
    workflow_dispatch:

env:
  MISE_ENV: audit

jobs:
    security_audit:
        if: ${{ !contains(github.event.commits[0].message, '[skip ci]') }}
        runs-on: ubuntu-24.04
        steps:
          - name: Harden Runner
            uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
            with:
              disable-sudo: true
              egress-policy: audit
              allowed-endpoints: >
                api.deps.dev:443
                api.github.com:443
                api.securityscorecards.dev:443
                github.com:443
                mise.jdx.dev
                objects.githubusercontent.com
          - name: Checkout
            uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

          - name: Install mise-en-place
            uses: jdx/mise-action@7a111ead46986ccad89a74ad013ba2a7c08c9e67 # v2
            with:
              install: false
              experimental: true

          - name: Install Rust
            uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
            with:
              toolchain: stable

          - name: Install mise tools
            env:
              MISE_ENV: audit
            run: mise install

          - name: Security Audit
            run: mise run audit
