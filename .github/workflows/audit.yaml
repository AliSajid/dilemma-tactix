---
name: Security Audit

on:
    schedule:
        - cron: 0 0 1,15 * *
    push:
        paths:
            - '**/Cargo.toml'
            - '**/Cargo.lock'
    workflow_dispatch:

jobs:
    audit_needed:
      runs-on: ubuntu-24.04
      outputs:
        audit_needed: steps.audit_needed.outputs.audit_needed
      steps:
          - name: Harden Runner
            uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
            with:
              disable-sudo: true
              egress-policy: audit
              allowed-endpoints: >
                api.deps.dev:443
                api.github.com:443
                github.com:443
                objects.githubusercontent.com
          - name: Checkout
            uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

          - name: Check if audit is needed
            id: audit_needed
            run: |
              BASE_SHA="${{ github.event.before }}"
              CURRENT_SHA="${{ github.sha }}"

              # Fallback if BASE_SHA is empty
              if [ -z "$BASE_SHA" ]; then
                BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "$CURRENT_SHA")
              fi

              if git diff --name-only "$BASE_SHA" "$CURRENT_SHA" | grep -Eq 'Cargo\.toml|Cargo\.lock'; then
                echo "audit_needed=true" >> "$GITHUB_OUTPUT"
              else
                echo "audit_needed=false" >> "$GITHUB_OUTPUT"
              fi

    security_audit:
        if: ${{ !contains(github.event.commits[0].message, '[skip ci]') && needs.audit_needed.audit_needed == 'true'}}
        needs:
          - audit_needed
        runs-on: ubuntu-24.04
        env:
          MISE_ENV: audit
        steps:
          - name: Harden Runner
            uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
            with:
              disable-sudo: true
              egress-policy: audit
              allowed-endpoints: >
                api.deps.dev:443
                api.github.com:443
                api.securityscorecards.dev:443
                github.com:443
                mise.jdx.dev:443
                objects.githubusercontent.com:443
          - name: Checkout
            uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

          - name: Install mise-en-place
            uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3
            with:
              install: false
              experimental: true

          - name: Install Rust
            uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
            with:
              toolchain: stable

          - name: Install mise tools
            env:
              MISE_ENV: audit
            run: mise install

          - name: Security Audit
            run: mise run audit
