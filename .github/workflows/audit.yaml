---
name: Security Audit

on:
    schedule:
        - cron: 0 0 1,15 * *
    push:
        paths:
            - '**/Cargo.toml'
            - '**/Cargo.lock'
    workflow_dispatch:

jobs:
    audit_needed:
      runs-on: ubuntu-24.04
      outputs:
        audit_needed: steps.audit_needed.outputs.audit_needed
      steps:
          - name: Harden Runner
            uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
            with:
              disable-sudo: true
              egress-policy: audit
              allowed-endpoints: >
                api.deps.dev:443
                api.github.com:443
                github.com:443
                objects.githubusercontent.com
          - name: Checkout
            uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

          - name: Check if audit is needed
            id: audit_needed
            run: |
                  BASE_SHA=${{ github.event.before }}
                  if [ -z "$BASE_SHA" ]; then BASE_SHA=$(git rev-parse HEAD~1); fi
                  if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -Eq 'Cargo\.toml|Cargo\.lock'; then
                    echo "Rust dependency files changed"
                    echo "audit_needed=true" >> $GITHUB_OUTPUT
                  else
                    echo "No Rust dependency changes"
                    echo "audit_needed=false" >> $GITHUB_OUTPUT
                  fi

    security_audit:
        # if: ${{ !contains(github.event.commits[0].message, '[skip ci]') && needs.audit_needed.audit_needed == 'true'}}
        needs:
          - audit-needed
        runs-on: ubuntu-24.04
        env:
          MISE_ENV: audit
        steps:
          - name: Harden Runner
            uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
            with:
              disable-sudo: true
              egress-policy: audit
              allowed-endpoints: >
                api.deps.dev:443
                api.github.com:443
                api.securityscorecards.dev:443
                github.com:443
                mise.jdx.dev:443
                objects.githubusercontent.com:443
          - name: Checkout
            uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

          - name: Install mise-en-place
            uses: jdx/mise-action@c94f0bf9e520b150e34c017db785461f7e71c5fb # v2
            with:
              install: false
              experimental: true

          - name: Install Rust
            uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
            with:
              toolchain: stable

          - name: Install mise tools
            env:
              MISE_ENV: audit
            run: mise install

          - name: Security Audit
            run: mise run audit
